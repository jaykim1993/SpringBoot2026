<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

	<title>게시글 작성</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">

    <script th:src="@{/js/member.js}"></script>
</head>
<body>

	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	
	<section>
	    <div id="section_wrap">
	        <div class="word">게시글 작성</div>
	
	        <div class="content">
	            <form th:action="@{/board/writePro}"
	            method="POST" 
	            name="board_form">
	                <table width="600" border="1">
	                    <tr height="40">
	                        <td align="center" width="150">작성자</td>
	                        <td align="center" width="150">
	                            <input 
	                            type="text" 
	                            name="writer"/>
	                        </td>
	                    </tr>
	
	                    <tr height="40">
	                        <td align="center" width="150">제목</td>
	                        <td align="center" width="150">
	                            <input 
	                            type="text" 
	                            name="subject" 
	                            class="b_subject"/>
	                        </td>
	                    </tr>
	
	                    <tr height="40">
	                        <td align="center" width="150">비밀번호</td>
	                        <td align="center" width="150">
	                            <input 
	                            type="password" 
	                            name="writerPw" 
	                            class="b_subject"
	                            required 
	                            placeholder="비밀번호를 입력해주세요."/>
	                        </td>
	                    </tr>
	                    <tr height="40">
	                        <td align="center" width="150">글내용</td>
	                        <td align="center" width="150">
	                            <textarea 
	                            rows="10" 
	                            cols="55" 
	                            name="content" 
	                            class="b_contents">
	                            </textarea>
	                        </td>
	                    </tr>
	
	                    <tr height="40">
	                        <td align="center" colspan="2">
	                            <input type="submit" value="글쓰기"/>&nbsp;&nbsp;
	                            <input type="reset" value="다시작성"/>&nbsp;&nbsp;
	                            <input type="button"
	                                   value="목록보기"
	                                   th:onclick="|location.href='@{/board/list}'|"/>
	                        </td>
	                    </tr>
	                </table>
	            </form>
	        </div>
	    </div>
	</section>
	
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>

</body>
</html>
