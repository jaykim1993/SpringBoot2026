<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원 가입</title>
<Link rel="stylesheet" th:href="@{/css/common.css}">
<Link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
<Link rel="stylesheet" th:href="@{/css/home.css}">
<Link rel="stylesheet" th:href="@{/css/member.css}">
<script th:src="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	<section>
		<div id="section_wrap">
			<div class="word">개인 상세 정보</div>
			<div class="content">
			
			<table style="width: 800px;">
			  <tr>
			  	<th width="100">아이디</th>
			  	<td th:text=${oneInfo.id}></td>
			  </tr>
			  <tr>
			  	<th>E-Mail</th>
			  	<td th:text=${oneInfo.mail}></td>
			  </tr>
			  <tr>
			  	<th>전화번호</th>
			  	<td th:text=${oneInfo.phone}></td>
			  </tr>
			  <tr>
			  	<th>등록일</th>
			  	<td th:text=${oneInfo.reg_date}></td>
			  </tr>
			</table>
			
			<div class="btn-area">
				<a th:href="@{/member/modify(id=${oneInfo.id})}" class="btn">정보수정</a>
				<a th:href="@{/member/delete(id=${oneInfo.id})}" 
				class="btn btn-danger"
				onclick="return confirm('정말 삭제하시겠습니까? 삭제된 데이터는 복구 할수 없습니다.');">회원삭제</a>
<!-- 				<a th:href="@{/member/list}" class="btn">목록보기</a>
				<a th:href="@{/member/signup}" class="btn">회원가입</a> -->
			</div>
			
			</div>
		</div>
	</section>
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
</body>
</html>
