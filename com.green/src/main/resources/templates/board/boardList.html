<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원 가입</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/header_nav_footer.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">

    <script th:src="@{/js/member.js}"></script>
</head>
<body>

	<header th:replace="~{/include/header_nav_footer.html::header}"></header>
	<nav th:replace="~{/include/header_nav_footer.html::nav}"></nav>
	<section>
		<div id="section_wrap">
			<div class="word">게시글 보기</div>
			<div class="content">
			<script th:if="${msg}">
				alert('[[${msg}]]')
			</script>
		      <table width="700" border="1">
		        <tr height="40">
		          <td colspan="5" align="right">
		            <a th:href="@{/board/write}" class="write-btn">글쓰기</a>
		          </td>
		        </tr>
		        <tr height="40">
		          <td width="50" align="center">번호</td>
		          <td width="320" align="center">제목</td>
		          <td width="100" align="center">작성자</td>
		          <td width="150" align="center">작성일</td>
		          <td width="80" align="center">조회수</td>
		        </tr>
		      <tr th:each="li : ${list}">
				  <td th:text="${li.num}"></td>
				  <td>
				    <a th:href="@{/board/boardInfo(num=${li.num})}" 
				    th:text="${li.subject}" ></a>
				  </td>
				  <td th:text="${li.writer}"></td>
				  <td th:text="${li.reg_date}"></td>
				  <td th:text="${li.readcount}"></td>
				</tr>
				</table>
				
				<div id="search_wrap" style="text-align: center; margin-top: 20px;">
				  <form th:action="@{/board/list}" method="get">
				    <select name="searchType" style="padding: 5px;">
				    	<!-- opthion value는 선택 시 값이 넘어간다. -->
				      	<option value="subject">제목</option>
				      	<option value="content">내용</option>
				    </select>
				
				    <input type="text" 
				    name="searchkeyword" 
				    placeholder="검색어를 입력하세요">
				
				    <input type="submit" 
				    value="검색" class="searchBtn">
				
				    <input type="button" 
				    value="전체보기" class="searchBtn"
				    th:onclick="|location.href='@{/board/list}'|">
				  </form>
				</div>
			</div>
		</div>
	</section>
	<footer th:replace="~{/include/header_nav_footer.html::footer}"></footer>
</body>
</html>
