<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div class="add">
		<h2>주소 등록</h2>
		<form th:action="@{/add-address}" method="post">
		<!-- required 없으면 → 빈 값도 서버로 날아감 -->
		<!-- required 있으면 → 전송 자체가 안 됨 -->
			이름: <input type="text" name="name" required/><br>
			도시: <input type="text" name="city" required/><br>
			<button type="submit">주소 추가</button>
		</form>
	</div>
	
	<div class="list">
		<h2>주소록 목록</h2>
		<table>
		  <thead>
			  <tr>
			  	<th>이름</th>
				<th>도시</th>
			  </tr>
		  </thead>
		  <tbody>
		    <tr th:each="addr : ${list}">
			    <td th:text = "${addr.name}">이름</td>
			    <td th:text = "${addr.city}">도시</td>
		    </tr>
		    <!-- ${#lists.isEmpty(list)} : 
		    		list 가 비어있으면 해당 html 구문 출력
		    		아니면 출력 없이 넘어감
		    -->
		    <tr th:if="${#lists.isEmpty(list)}">
			    <td colspan="2">
			    	등록된 주소가 없습니다.
			    </td>
		    </tr>
		  </tbody>
		</table>
	
	</div>
	
</body>
</html>
