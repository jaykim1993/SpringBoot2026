<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="[https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css](https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css)">
<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
	<header th:flagment="header">
		<div id="top">
			<div class="title_wrap">
				<p>
					<b>게시판(揭示板)</b> 또는 <b>알림판</b>은 공고나 메시지 등을 붙여 사람들이 볼 수 있도록 하는 판이다. 주로 기업이나 학교와 같은 여러 곳에서 많이 볼 수 있다.
				</p>
			</div>
		</div>
		<div id="header_wrap">
		    <a th:href="@{/}">
		        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25"
		             fill="currentColor" class="bi bi-house-door-fill" viewBox="0 0 16 16">
		            <path d="M6.5 14.5v-3.505c0-.245.25-.495.5-.495h2c.25 0 .5.25.5.5v3.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293L8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5"/>
		        </svg>
		    </a>
		
		    <!-- 로그인 전 -->
		    <th:block th:if="${session.loginedMember == null}">
		        <a th:href="@{/member/login}">로그인</a>
		        <a th:href="@{/member/signup}">회원가입</a>
		    </th:block>
		
		    <!-- 로그인 후 -->
		    <th:block th:if="${session.loginedMember != null}">
		        <a th:href="@{/}" th:text="${session.loginedMember.nickname}+'님'"></a>
		        <a th:href="@{/member/logout}">로그아웃</a>
		    </th:block>
		
		    <a href="#" id="writeBtn"
			th:data-login="${session.loginedMember != null}"
			>글쓰기</a>
		    <a th:href="@{/board/main}">글 목록보기</a>
		</div>
			<script th:src="@{/js/board.js}"></script>

	</header>

	
	<footer th:flagment ="footer">
		<div id = "footer_wrap">
			© Copyright jaykim809@gmail.com<br>
			2026 [JayKim/GreenAcademy]. All Rights Reserved.
		</div>
	</footer>

</body>
</html>
