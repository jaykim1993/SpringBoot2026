<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원가입 결과</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/member.css}">
<script th:src="@{/js/member.js}"></script>
</head>
<body>
	<header th:replace="~{/header_footer/HeaderFooter.html::header}"></header>
	<section>
		<div id="section_wrap">
			<div class="word">회원가입</div>
			<div class="content">
				<div th:if="${result>0}">
					<h2>회원가입 성공</h2>
				</div>
				<div th:if="${result<=0}">
					<h2>회원가입 실패</h2>
				</div>
			</div>
		</div>
	</section>
<footer th:replace="~{/header_footer/HeaderFooter.html::footer}"></footer>
    <script th:if="${msg}">
        alert('[[${msg}]]');
    </script>
</body>
</html>
