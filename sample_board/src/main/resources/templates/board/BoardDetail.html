<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Board Detail</title>
<link rel="stylesheet" th:href="@{/css/common.css}">
<link rel="stylesheet" th:href="@{/css/table.css}">
</head>
<body>

<header th:replace="~{/header_footer/HeaderFooter.html::header}"></header>

<section>
	<div class="section_wrap">
		<div class="section_header">
			<h2>글 내용 확인하기</h2>
		</div>

		<div class="content">
			<table class="board_table">
				<tr>
					<th>글번호</th>
					<td th:text="${num}"></td>
				</tr>
				<tr>
					<th>등록일</th>
					<td th:text="${postDetail.createdAt}"></td>
				</tr>
				<tr>
					<th>작성자</th>
					<td th:text="${postDetail.writer}"></td>
				</tr>
				<tr>
					<th>제목</th>
					<td th:text="${postDetail.title}"></td>
				</tr>
				<tr>
					<th>내용</th>
					<td class="post_content"
					    th:text="${postDetail.content}">
					</td>
				</tr>

				<tr>
					<td colspan="2" class="btn_area">
						<a th:href="@{/board/modify(no=${postDetail.no}, num=${num})}">수정하기</a>
						<!-- th:onclick="|return modifyCheck(${isLogin};)|" -->
						
						<a th:href="@{/board/main}">목록보기</a>
						<a th:href="@{/board/delete(no=${postDetail.no})}"
						th:onclick="|return deleteCheck(${isLogin});|">삭제하기</a>
					</td>
					
				</tr>
			</table>
		</div>
	</div>
</section>

<footer th:replace="~{/header_footer/HeaderFooter.html::footer}"></footer>
		<script th:if="${msg}">
			alert('[[${msg}]]')
		</script>
<script>
/* function modifyCheck(isLogin) {

    if (!isLogin) {
        alert("글을 수정하려면 로그인이 필요합니다.");
        return false;
    }

    return true;
} */
function deleteCheck(isLogin) {

    if (!isLogin) {
        alert("글을 삭제하려면 로그인이 필요합니다.");
        return false;
    }

    return confirm("정말 삭제하시겠습니까?\n삭제된 데이터는 복구할 수 없습니다.");
}
</script>
</body>
</html>
