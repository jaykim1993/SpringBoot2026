<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>도서 대여 입력</title>
<style>
        h2 {
            margin-bottom: 20px;
        }

        form{
            margin-bottom: 10px;
        }
        label {
            margin-bottom: 10px;
            display: inline-block;
            width: 80px;
        }
        input {
            margin-bottom: 10px;
            width: 200px;
			padding: 5px;
        }
        button {
            margin-top: 10px;
            padding: 6px 15px;
        }
</style>
</head>
<body>

<h2>도서 대여 입력</h2>

<form th:action="@{/book/rentList}" method="post">

    <label for="title">책 제목</label>
    <input type="text" name="title" placeholder="제목 입력"  />
    <br>

    <label for="user">대여자</label>
    <input type="text" name="user" placeholder="대여자 입력" />
    <br>

    <label for="sDate">대여 시작일</label>
    <input type="date" name="sDate"  />
    <br>

    <label for="eDate">대여 종료일</label>
    <input type="date" name="eDate"/>
    <br><br>

    <input type="submit" value="예약 내역 보기"/>

</form>
<div class="btn-area">
    <a th:href="@{/book/rent}">도서 추가 대여</a>
</div>
</body>
</html>
