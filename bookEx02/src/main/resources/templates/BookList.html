<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 등록 결과</title>
    <style>
body {
            font-family: Arial, sans-serif;
        }
        h2 {
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse;
            width: 400px;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f0f0f0;
            width: 120px;
        }
        .btn-area {
            margin-top: 20px;
        }
        a {
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #333;
            background-color: #eee;
            color: #000;
        }
    </style>
</head>
<body>

<h2>도서 목록</h2>
		<table>
		  <thead>
			  <tr>
			  	<th>ISBN</th>
				<th>도서명</th>
				<th>저자</th>
				<th>등록자</th>
				<th>등록일</th>
			  </tr>
		  </thead>
		  <tbody>
		    <tr th:each="addr : ${book}">
			    <td th:text = "${addr.isbn}">ISBN</td>
			    <td th:text = "${addr.title}">도서명</td>
			    <td th:text = "${addr.author}">저자</td>
			    <td th:text = "${addr.adder}">등록자</td>
			    <td th:text = "${addr.addedDate}">등록일</td>
		    </tr>
		  </tbody>
		</table>


<div class="btn-area">
    <a th:href="@{/book/addbook}">도서 추가 등록</a>
    <a th:href="@{/book/rent}">도서 대여</a>
</div>

</body>
</html>
