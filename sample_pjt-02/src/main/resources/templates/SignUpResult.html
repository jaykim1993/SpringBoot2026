<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>SignUpInfo</title>
</head>
<body>
	<!-- thymeleaf, th:text = 모든 데이터를 다 문자로 변환해서 화면에 출력 -->
	<!-- ${} 모든 데이터를 다 문자로 변환해서 화면에 출력 -->
	<h2>회원 가입 정보</h2>
	<p>가입시간 : <span th:text="${now}"></span></p>
	<p>아이디 : <span th:text="${new_id}"></span></p>
	<p>비밀번호 : <span th:text="${new_pw}"></span></p>
	<p>E-Mail : <span th:text="${new_email}"></span></p>
</body>
</html>
